services:
  # ─────────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: cova-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cova_tasks
      MYSQL_USER: cova_user
      MYSQL_PASSWORD: cova_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cova-network

  # ─────────────────────────────────────────────
  # Spring Boot Backend API
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cova-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: cova_tasks
      MYSQL_USER: cova_user
      MYSQL_PASSWORD: cova_pass
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47}
    ports:
      - "8082:8080"
    networks:
      - cova-network

  # ─────────────────────────────────────────────
  # React Frontend (served via Nginx)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: cova-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"
    environment:
      VITE_API_URL: http://localhost:8082
    networks:
      - cova-network

volumes:
  mysql_data:
    driver: local

networks:
  cova-network:
    driver: bridge